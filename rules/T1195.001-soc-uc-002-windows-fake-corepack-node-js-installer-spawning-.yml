name: "SOC-UC-002-Windows-Fake Corepack/Node.js Installer Spawning PowerShell/CMD with Download Cradle"

description: |
  Detects suspicious execution of PowerShell or CMD processes spawned by Node.js installer or corepack binaries, exhibiting download cradle or encoded payload patterns. This behavior is associated with infostealer and proxyware campaigns distributed via fake Corepack sites, where attackers leverage compromised software supply chains to gain initial access or execute malicious payloads. Applies to Windows endpoints with Elastic Defend process telemetry.

author:
  - "DAC Agent (n8n)"

enabled: true
type: esql
language: esql

severity: "high"
risk_score: 73

tags:
  - "Domain: Endpoint"
  - "OS: Windows"
  - "Use Case: Threat Detection"
  - "Tactic: Initial Access"
  - "Tactic: Execution"
  - "T1195.001"
  - "T1204.002"
  - "T1059.001"
  - "T1059.003"
  - "Data Source: Elastic Defend"
  - "FakeCorepack"
  - "infostealer"
  - "proxyware"

query: |
  FROM logs-endpoint.events.* METADATA _id, _index, _version | WHERE @timestamp > NOW() - 7 DAYS AND event.category == "process" AND event.action == "exec" AND process.name IN ("powershell.exe", "pwsh.exe", "cmd.exe") AND process.parent.name IN ("node.exe", "npm", "npm.cmd", "npx", "npx.cmd", "corepack", "corepack.cmd", "msiexec.exe") AND ( process.command_line LIKE "*-enc*" OR process.command_line LIKE "*EncodedCommand*" OR process.command_line LIKE "*FromBase64String*" OR process.command_line LIKE "*WebClient*" OR process.command_line LIKE "*DownloadString*" OR process.command_line LIKE "*DownloadFile*" OR process.command_line LIKE "*Invoke-Expression*" OR process.command_line LIKE "*IEX*" OR process.command_line LIKE "*Start-BitsTransfer*" OR process.command_line LIKE "*curl*http*" OR process.command_line LIKE "*wget*http*" OR process.command_line LIKE "*-nop*-w*hidden*" OR process.command_line LIKE "*-WindowStyle*Hidden*" ) | KEEP _id, _index, _version, @timestamp, host.name, user.name, process.name, process.command_line, process.parent.name, process.executable, process.working_directory, process.code_signature.status | LIMIT 100

interval: "5m"
from: "now-10m"
to: "now"

timestamp_override: "event.ingested"
timestamp_override_fallback_disabled: false

