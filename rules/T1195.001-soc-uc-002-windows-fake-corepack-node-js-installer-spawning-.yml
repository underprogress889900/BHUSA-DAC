note: |
  ### What triggered this alert
  This alert was triggered by the execution of PowerShell or CMD (cmd.exe, powershell.exe, pwsh.exe) processes, spawned by Node.js installer or corepack-related binaries (such as node.exe, npm, npx, corepack, msiexec.exe), where the command line contains indicators of download cradles (e.g., DownloadString, WebClient, curl, wget) or encoded/obfuscated payloads (e.g., -enc, EncodedCommand, FromBase64String). This pattern is strongly associated with recent infostealer and proxyware campaigns distributed via fake Corepack websites, where attackers use malicious installers to gain initial access or execute payloads on Windows endpoints.
  
  ### Possible investigation steps
  - Review the parent process (process.parent.name) and its command line to confirm if it is a legitimate Node.js or installer operation.
  - Examine the full command line (process.command_line) for signs of obfuscation, download cradle usage, or suspicious URLs.
  - Check the code signature status (process.code_signature.status) of both the parent and child processes to determine if unsigned or invalid binaries were involved.
  - Identify the user context (user.name) and host (host.name) to assess the scope and potential impact.
  - Pivot to related process activity on the same host and user to identify follow-on actions or lateral movement.
  - Review recent downloads, file writes, or network connections from the affected host for additional indicators of compromise.
  
  ### False positive analysis
  - Legitimate Node.js or npm-based installers that use PowerShell or CMD for benign post-install scripts may trigger this alert, especially in development environments.
  - Automated build pipelines or software update mechanisms that leverage scripting for legitimate downloads or configuration may also match.
  
  ### Response and remediation
  - Contain the affected endpoint to prevent further execution or data exfiltration.
  - Collect forensic artifacts: process tree, command lines, downloaded files, and network logs.
  - Eradicate by removing any unauthorized or malicious installers, scripts, or payloads.
  - Reset credentials for any accounts used in the suspicious session.
  - Review and update software supply chain controls to prevent future abuse.
  
