      - id: "T1566.002"
        name: "Spearphishing Link"
        reference: "https://attack.mitre.org/techniques/T1566/002/"
        subtechnique: []

note: |
  ### What triggered this alert
  This alert was triggered because a shell interpreter (powershell.exe, cmd.exe, wscript.exe, or cscript.exe) was started by a parent process associated with a web browser or Node.js (chrome.exe, firefox.exe, msedge.exe, iexplore.exe, opera.exe, node.exe). This is highly unusual and often indicates a user has clicked a malicious link or a browser exploit has executed code, as seen in infostealer and proxyware campaigns like Fake Corepack.
  
  ### Possible investigation steps
  - Review the process.parent.name and process.name fields to confirm the parent-child relationship.
  - Examine process.command_line for suspicious or obfuscated arguments.
  - Check user.name to determine which user initiated the process.
  - Investigate process.hash.sha256 and process.executable for known malicious binaries.
  - Review host.name to determine the endpoint involved and check for other suspicious activity around the same time (@timestamp).
  - Pivot on process.entity_id and process.ppid to reconstruct the process tree and identify any follow-on actions or payloads.
  - Look for related alerts or events involving the same user or host.
  
  ### False positive analysis
  - Some legitimate browser extensions, developer tools, or enterprise automation platforms may spawn shell interpreters for updates or scripting. For example, legitimate IT automation or browser-based remote management tools could trigger this alert.
  
  ### Response and remediation
  - Isolate the affected endpoint from the network to prevent lateral movement.
  - Collect forensic artifacts: memory, process list, and relevant logs.
  - Kill any suspicious or unauthorized processes.
  - Reset credentials for affected users if compromise is confirmed.
  - Review and block any malicious domains or URLs involved.
  - Patch browser and Node.js installations to prevent exploitation.
  
  ### References
  - https://socket.dev/blog/fake-corepack-site-distributes-infostealer-and-proxyware
  - https://attack.mitre.org/techniques/T1204/001/
