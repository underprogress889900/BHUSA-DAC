rule_id: "c8bc1b1d-4644-43fe-8beb-ccb503b14b64"

name: "SOC-UC-002-Windows-Browser or Node.js Spawning Shell Interpreter"

description: |
  Detects instances where a shell interpreter (powershell.exe, cmd.exe, wscript.exe, or cscript.exe) is launched by a web browser (chrome.exe, firefox.exe, msedge.exe, iexplore.exe, opera.exe) or Node.js (node.exe). This behavior is highly suspicious and often associated with initial access or execution techniques used by malware like OpenShield/Apprunner infostealer and proxyware campaigns (e.g., Fake Corepack). The rule applies to Windows endpoints monitored by Elastic Defend.

author:
  - "DAC Agent (n8n)"

enabled: true
type: esql
language: esql

severity: "high"
risk_score: 73

tags:
  - "Domain: Endpoint"
  - "OS: Windows"
  - "Use Case: Threat Detection"
  - "Tactic: Execution"
  - "Tactic: Initial Access"
  - "T1204.001"
  - "T1059.001"
  - "T1059.003"
  - "T1566.002"
  - "Data Source: Elastic Defend"

query: |
  FROM logs-endpoint.events.process-* METADATA _id, _index, _version
  | WHERE process.parent.name IN ("chrome.exe", "firefox.exe", "msedge.exe", "iexplore.exe", "opera.exe", "node.exe")
    AND process.name IN ("powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe")
    AND event.action == "start"
  | KEEP _id, _index, _version

interval: "5m"
from: "now-10m"
to: "now"

timestamp_override: "event.ingested"
timestamp_override_fallback_disabled: false

threat:
  - framework: "MITRE ATT&CK"
    tactic:
      id: "TA0002"
      name: "Execution"
      reference: "https://attack.mitre.org/tactics/TA0002/"
