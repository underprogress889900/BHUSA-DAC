note: |
  ### What triggered this alert
  This alert was triggered by a DNS query to a domain known to be associated with the Fake Corepack infostealer and OpenShield proxyware campaign. These domains are linked to malware delivery, credential theft, and proxyware monetization. The detection is based on a match to a curated list of malicious domains observed in recent threat intelligence.
  
  ### Possible investigation steps
  - Review the host.name and user.name fields to identify the affected endpoint and user.
  - Examine process.name to determine which process initiated the DNS request; suspicious or unexpected processes (e.g., powershell.exe, cmd.exe, or unknown binaries) may indicate malicious activity.
  - Check for additional DNS queries to other suspicious domains from the same host or user.
  - Investigate recent process execution and file creation events on the endpoint for signs of malware installation or persistence mechanisms.
  - Review network.protocol and dns.question.type for evidence of DNS tunneling or non-standard DNS usage.
  - Correlate with authentication and credential access logs for signs of credential theft or lateral movement.
  
  ### False positive analysis
  - Some legitimate software or IT tools may contact domains that have been recently compromised or repurposed for malicious use. For example, a security researcher or automated sandbox may trigger this alert during threat research or malware analysis.
  - Confirm with the user or asset owner if the activity was expected or part of a legitimate workflow.
  
  ### Response and remediation
  - Isolate the affected endpoint from the network to prevent further malicious activity.
  - Collect forensic artifacts: memory dump, running processes, recent files, and DNS cache.
  - Remove any identified malware or unauthorized proxyware.
  - Reset credentials used on the affected system.
  - Monitor for further suspicious DNS or network activity from the same user or host.
  - Apply threat intelligence updates to block known malicious domains at the network perimeter.
  
