name: "SOC-UC-002-Network-Fake Corepack Infostealer & Proxyware DNS Activity"

description: |
  Detects DNS queries to domains associated with the Fake Corepack infostealer and OpenShield proxyware campaign. This activity is significant because these domains are linked to malware delivery, credential theft, and proxyware monetization, representing both initial access and ongoing command-and-control. The rule applies to any environment with Elastic Defend network telemetry enabled.

author:
  - "DAC Agent (n8n)"

enabled: true
type: esql
language: esql

severity: "high"
risk_score: 73

