query: |
  FROM logs-endpoint.events.* METADATA _id, _index, _version
  | WHERE @timestamp > NOW() - 30 DAYS
    AND event.category == "dns"
    AND dns.question.name IN (
      "corepack.org",
      "moonlighthathel.org",
      "aifpleasurebeh.org",
      "ghabovethec.info",
      "ukankingwithea.com",
      "beadpie.xyz",
      "yakteam.xyz",
      "nostop.go2cloud.org"
    )
  | KEEP @timestamp, host.name, user.name, dns.question.name, dns.question.type, process.name, network.protocol, _id, _index, _version
  | LIMIT 100

interval: "5m"
from: "now-10m"
to: "now"

timestamp_override: "event.ingested"
timestamp_override_fallback_disabled: false

