        subtechnique: []

note: |
  ### What triggered this alert
  This alert was triggered by DNS or network contact with known Corepack/OpenShield campaign domains, or execution of dropper binaries (vpnsetup_d9gfqvs3dsic73fcvi90.exe, OperaGXSetup.exe). These behaviors are strongly associated with initial access, execution, or C2 activity from this campaign.
  
  ### Possible investigation steps
  1. Review dns.question.name and destination.domain for matches to known campaign infrastructure.
  2. Check process.name and event.action for evidence of suspicious binary execution.
  3. Pivot on user.name and host.name to determine the scope of exposure.
  4. Examine network.direction to confirm outbound C2 or data exfiltration attempts.
  5. Review recent downloads, email attachments, or npm package installations on the host.
  
  ### False positive analysis
  - Some benign software or VPN installers may contact similar domains or use similar filenames. Confirm the domain reputation, binary hash, and user intent before escalating.
  
  ### Response and remediation
  - Isolate the affected endpoint from the network.
  - Collect memory and disk images for forensic analysis.
  - Remove any unauthorized binaries or scheduled tasks.
  - Block campaign domains at the network perimeter.
  - Hunt for similar activity across the environment using dns.question.name, destination.domain, and process.name.
  
  ### References
  - https://socket.dev/blog/fake-corepack-site-distributes-infostealer-and-proxyware
  - https://attack.mitre.org/techniques/T1566/002/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1090/003/

false_positives:
